kafka:
  enabled: false

minio:
  enabled: false

alertmanager:
  replicas: 1

ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false

querier:
  replicas: 1

query_scheduler:
  replicas: 1

distributor:
  replicas: 1

compactor:
  replicas: 1

ruler:
  replicas: 1

overrides_exporter:
  replicas: 1

mimir:
  structuredConfig:
    memberlist:
      join_members: []

    common:
      storage:
        backend: s3
        s3:
          endpoint: ${HOST}:9000
          insecure: true
          access_key_id: admin
          secret_access_key: ${MINIO_PASS}
          bucket_name: mimir

    blocks_storage:
      backend: s3
      s3:
        endpoint: ${HOST}:9000
        insecure: true
        access_key_id: admin
        secret_access_key: ${MINIO_PASS}
        bucket_name: mimir

    ruler_storage:
      backend: s3
      s3:
        endpoint: ${HOST}:9000
        insecure: true
        access_key_id: admin
        secret_access_key: ${MINIO_PASS}
        bucket_name: mimir

    alertmanager_storage:
      backend: s3
      s3:
        endpoint: ${HOST}:9000
        insecure: true
        access_key_id: admin
        secret_access_key: ${MINIO_PASS}
        bucket_name: mimir
